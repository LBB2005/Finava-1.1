<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Finava · Sidebar Loading Animations</title>
<style>
  :root {
    --color-accent: #4d9cf8;
    --bg: #0e1116;
    --panel: #161b22;
    --rail: #11151b;
    --text: #e6edf3;
    --muted: #8b949e;
    --border: #232a33;
    --up: #2ec26b;
    --down: #f0616d;
  }
  html[data-theme="light"] {
    --color-accent: #1a4b8f;
    --bg: #f6f8fa;
    --panel: #ffffff;
    --rail: #fbfcfd;
    --text: #1a2027;
    --muted: #5b6672;
    --border: #e3e8ef;
    --up: #1a9d57;
    --down: #d23b48;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px;
    background: color-mix(in oklab, var(--bg) 80%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .toggle {
    display: inline-flex; gap: 6px; align-items: center;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px;
  }
  .toggle button {
    border: 0; background: transparent; color: var(--muted);
    font: inherit; font-size: 12px; font-weight: 600;
    padding: 5px 12px; border-radius: 999px; cursor: pointer;
  }
  .toggle button.active { background: var(--color-accent); color: #fff; }
  html[data-theme="light"] .toggle button.active { color: #fff; }

  main { padding: 28px; max-width: 1180px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 18px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .card.current { border-color: color-mix(in oklab, var(--color-accent) 45%, var(--border)); }
  .card-head { padding: 14px 16px 10px; }
  .card-head .name { font-size: 13.5px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
  .badge { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
           color: var(--color-accent); background: color-mix(in oklab, var(--color-accent) 16%, transparent);
           padding: 2px 7px; border-radius: 999px; }
  .card-head .desc { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.4; }

  /* BIG stage */
  .stage-big {
    height: 120px; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 45%, color-mix(in oklab, var(--color-accent) 7%, transparent), transparent 70%);
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  }

  /* AT-SCALE sidebar mock */
  .scale-wrap { padding: 12px 14px 16px; }
  .scale-label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
  .rail {
    background: var(--rail); border: 1px solid var(--border); border-radius: 12px;
    padding: 8px; width: 230px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 9px; font-size: 13px; font-weight: 500;
  }
  .nav-item.active { background: color-mix(in oklab, var(--color-accent) 12%, transparent); color: var(--text); }
  .nav-item .ic { width: 16px; height: 16px; border-radius: 5px; background: color-mix(in oklab, var(--text) 22%, transparent); flex: 0 0 auto; }
  .nav-item .lbl { flex: 1; }
  .nav-item.muted { color: var(--muted); }
  .nav-item.muted .ic { background: color-mix(in oklab, var(--text) 12%, transparent); }
  .trailing { margin-left: auto; display: flex; align-items: center; }

  /* ============ ANIMATION PRIMITIVES ============ */

  /* 0. CURRENT — single pulse dot */
  .dot-current { width: 7px; height: 7px; border-radius: 50%; background: var(--color-accent);
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--color-accent) 22%, transparent);
    animation: pulse-dot 1.4s infinite ease-in-out; }
  .big .dot-current { width: 18px; height: 18px; box-shadow: 0 0 0 7px color-mix(in oklab, var(--color-accent) 22%, transparent); }
  @keyframes pulse-dot { 0%,80%,100% { opacity: .25; transform: scale(.75); } 40% { opacity: 1; transform: scale(1); } }

  /* 1. TWIN ORBS — two balls pulsing out of phase */
  .twin { display: inline-flex; gap: 5px; }
  .twin span { width: 7px; height: 7px; border-radius: 50%; background: var(--color-accent); animation: pulse-dot 1.2s infinite ease-in-out; }
  .twin span:nth-child(2) { animation-delay: .35s; }
  .big .twin span { width: 16px; height: 16px; }
  .big .twin { gap: 10px; }

  /* 2. ORBIT — small ball orbits a soft core */
  .orbit { position: relative; width: 16px; height: 16px; }
  .orbit .core { position: absolute; inset: 4px; border-radius: 50%; background: color-mix(in oklab, var(--color-accent) 35%, transparent); }
  .orbit .sat { position: absolute; top: 50%; left: 50%; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%;
    background: var(--color-accent); transform-origin: -3px center; animation: orbit 1.1s linear infinite; }
  @keyframes orbit { to { transform: rotate(360deg); } }
  .big .orbit { width: 40px; height: 40px; }
  .big .orbit .sat { width: 11px; height: 11px; margin: -5.5px; transform-origin: -9px center; }

  /* 3. TICKER A — single symbol+price flip, color shifts up/down */
  .tickA { font: 600 12px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: -0.02em; min-width: 78px; text-align: right;
    animation: tickColor 3s infinite steps(1); }
  .tickA .sym { color: var(--muted); }
  @keyframes tickColor { 0% { color: var(--up); } 50% { color: var(--down); } 100% { color: var(--up); } }
  .big .tickA { font-size: 26px; min-width: auto; }

  /* 4. TICKER B — vertical reel cycling through tickers */
  .reel { height: 16px; overflow: hidden; font: 600 12px ui-monospace, Menlo, monospace; width: 92px; -webkit-mask-image: linear-gradient(transparent, #000 25%, #000 75%, transparent); }
  .reel ul { margin: 0; padding: 0; list-style: none; animation: reel 5s infinite cubic-bezier(.7,0,.3,1); }
  .reel li { height: 16px; display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
  .reel .up { color: var(--up); } .reel .down { color: var(--down); } .reel .sym { color: var(--muted); }
  @keyframes reel { 0%,15% { transform: translateY(0); } 25%,40% { transform: translateY(-16px); } 50%,65% { transform: translateY(-32px); } 75%,90% { transform: translateY(-48px); } 100% { transform: translateY(-64px); } }
  .big .reel { height: 34px; width: auto; font-size: 26px; }
  .big .reel li { height: 34px; }
  .big .reel ul { animation-name: reelBig; }
  @keyframes reelBig { 0%,15% { transform: translateY(0); } 25%,40% { transform: translateY(-34px); } 50%,65% { transform: translateY(-68px); } 75%,90% { transform: translateY(-102px); } 100% { transform: translateY(-136px); } }

  /* 5. TICKER C — horizontal scrolling tape */
  .tape { width: 110px; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
  .tape .row { display: inline-flex; white-space: nowrap; font: 600 11.5px ui-monospace, Menlo, monospace; gap: 16px; animation: tape 7s linear infinite; }
  .tape .row span b { color: var(--muted); font-weight: 600; margin-right: 5px; }
  .tape .up { color: var(--up); } .tape .down { color: var(--down); }
  @keyframes tape { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .big .tape { width: 320px; }
  .big .tape .row { font-size: 22px; gap: 28px; }

  /* 6. TICKER D — mini sparkline drawing itself */
  .spark { width: 64px; height: 18px; }
  .spark path { stroke: var(--color-accent); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw 2.2s ease-in-out infinite; }
  .spark .area { fill: color-mix(in oklab, var(--color-accent) 14%, transparent); stroke: none; opacity: 0; animation: fadeArea 2.2s ease-in-out infinite; }
  @keyframes draw { 0% { stroke-dashoffset: 120; } 55% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
  @keyframes fadeArea { 0%,40% { opacity: 0; } 70% { opacity: 1; } 100% { opacity: 0; } }
  .big .spark { width: 150px; height: 44px; }

  /* 7. TICKER E — digit-roll price counting */
  .digits { font: 700 12.5px ui-monospace, Menlo, monospace; color: var(--color-accent); display: inline-flex; align-items: center; gap: 1px; }
  .digits .roll { height: 15px; overflow: hidden; display: inline-block; }
  .digits .roll u { display: block; height: 15px; text-decoration: none; animation: roll 1.6s infinite cubic-bezier(.6,0,.4,1); }
  .digits .roll:nth-child(2) u { animation-duration: 1.15s; }
  .digits .roll:nth-child(3) u { animation-duration: 0.85s; }
  @keyframes roll { 0% { transform: translateY(0); } 100% { transform: translateY(-150px); } }
  .big .digits { font-size: 30px; }
  .big .digits .roll, .big .digits .roll u { height: 36px; }
  .big .digits .roll u { animation-name: rollBig; }
  @keyframes rollBig { 0% { transform: translateY(0); } 100% { transform: translateY(-360px); } }

  /* 8. TICKER F — bid/ask bars equalizer */
  .bars { display: inline-flex; align-items: flex-end; gap: 3px; height: 16px; }
  .bars i { width: 3px; background: var(--color-accent); border-radius: 2px; animation: bar 1s infinite ease-in-out; }
  .bars i:nth-child(1){ animation-delay: 0s; } .bars i:nth-child(2){ animation-delay: .15s; }
  .bars i:nth-child(3){ animation-delay: .3s; } .bars i:nth-child(4){ animation-delay: .45s; } .bars i:nth-child(5){ animation-delay: .2s; }
  @keyframes bar { 0%,100% { height: 30%; opacity:.5; } 50% { height: 100%; opacity: 1; } }
  .big .bars { height: 44px; gap: 7px; }
  .big .bars i { width: 8px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Finava · Sidebar loading animations</h1>
    <div class="sub">Current state + variations · shown big, then at real sidebar scale</div>
  </div>
  <div class="toggle">
    <button data-t="dark" class="active">Dark</button>
    <button data-t="light">Light</button>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<script>
  const TICK = `
    <span class="sym">NVDA</span> 0.0%`;

  // each design: name, badge, desc, html for the indicator
  const designs = [
    {
      name: "Pulse Dot", badge: "Current", current: true,
      desc: "Single 7px accent dot, scale + opacity breathe on a 1.4s loop with a soft glow ring.",
      html: `<span class="dot-current"></span>`
    },
    {
      name: "Twin Orbs", badge: "Ball ×2",
      desc: "Two balls pulsing out of phase — the classic “blue thing,” a touch more alive than one dot.",
      html: `<span class="twin"><span></span><span></span></span>`
    },
    {
      name: "Orbit", badge: "Ball",
      desc: "A satellite ball orbits a soft accent core. Calm, continuous, no flashing.",
      html: `<span class="orbit"><span class="core"></span><span class="sat"></span></span>`
    },
    {
      name: "Ticker · Flip", badge: "Ticker",
      desc: "A single symbol + price that color-shifts green/red like a live quote.",
      html: `<span class="tickA"><span class="sym">NVDA</span> +1.2%</span>`
    },
    {
      name: "Ticker · Reel", badge: "Ticker",
      desc: "Vertical reel cycling through a few tickers — feels like a quote board updating.",
      html: `<span class="reel"><ul>
        <li><span class="sym">AAPL</span><span class="up">+0.8%</span></li>
        <li><span class="sym">NVDA</span><span class="up">+2.1%</span></li>
        <li><span class="sym">TSLA</span><span class="down">-1.3%</span></li>
        <li><span class="sym">MSFT</span><span class="up">+0.4%</span></li>
        <li><span class="sym">AAPL</span><span class="up">+0.8%</span></li>
      </ul></span>`
    },
    {
      name: "Ticker · Tape", badge: "Ticker",
      desc: "Horizontal scrolling tape of a few symbols — a mini Bloomberg ribbon.",
      html: `<span class="tape"><span class="row">
        <span><b>AAPL</b><span class="up">+0.8%</span></span>
        <span><b>NVDA</b><span class="up">+2.1%</span></span>
        <span><b>TSLA</b><span class="down">-1.3%</span></span>
        <span><b>AAPL</b><span class="up">+0.8%</span></span>
        <span><b>NVDA</b><span class="up">+2.1%</span></span>
        <span><b>TSLA</b><span class="down">-1.3%</span></span>
      </span></span>`
    },
    {
      name: "Ticker · Sparkline", badge: "Ticker",
      desc: "A tiny price line draws itself, fades, redraws. Quiet and on-brand.",
      html: `<span class="spark"><svg viewBox="0 0 64 18" class="spark"><path class="area" d="M0,14 L10,9 L20,12 L30,5 L40,8 L52,3 L64,6 L64,18 L0,18 Z"/><path d="M0,14 L10,9 L20,12 L30,5 L40,8 L52,3 L64,6"/></svg></span>`
    },
    {
      name: "Ticker · Digit Roll", badge: "Ticker",
      desc: "Price digits roll like a flip-counter — the model is “pricing” while it thinks.",
      html: `<span class="digits">$<span class="roll"><u>0123456789</u></span><span class="roll"><u>0123456789</u></span>.<span class="roll"><u>0123456789</u></span></span>`
    },
    {
      name: "Ticker · Bars", badge: "Ticker",
      desc: "Equalizer of bid/ask bars rising and falling — market-pulse energy, very compact.",
      html: `<span class="bars"><i></i><i></i><i></i><i></i><i></i></span>`
    },
  ];

  const grid = document.getElementById("grid");
  grid.innerHTML = designs.map(d => `
    <div class="card ${d.current ? "current" : ""}">
      <div class="card-head">
        <div class="name">${d.name} <span class="badge">${d.badge}</span></div>
        <div class="desc">${d.desc}</div>
      </div>
      <div class="stage-big big">${d.html}</div>
      <div class="scale-wrap">
        <div class="scale-label">Actual size in sidebar</div>
        <div class="rail">
          <div class="nav-item muted"><span class="ic"></span><span class="lbl">Watchlist</span></div>
          <div class="nav-item active"><span class="ic"></span><span class="lbl">Chat</span><span class="trailing">${d.html}</span></div>
          <div class="nav-item muted"><span class="ic"></span><span class="lbl">Portfolio</span></div>
          <div class="nav-item muted"><span class="ic"></span><span class="lbl">Research</span></div>
        </div>
      </div>
    </div>
  `).join("");

  document.querySelectorAll(".toggle button").forEach(b => {
    b.addEventListener("click", () => {
      document.documentElement.setAttribute("data-theme", b.dataset.t);
      document.querySelectorAll(".toggle button").forEach(x => x.classList.toggle("active", x === b));
    });
  });
</script>
</body>
</html>
